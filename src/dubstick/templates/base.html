<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}dubstick{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {# 422 carries a validation message worth showing; other errors are not swapped in. #}
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true, "error": false}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4/dist/sse.min.js"></script>
</head>
<body hx-ext="sse" sse-connect="/events">
  <header class="top">
    <a class="brand" href="/">dubstick</a>
    <nav>
      {% set path = request.url.path %}
      <a href="/" class="{{ 'active' if path == '/' }}">Scan</a>
      <a href="/library" class="{{ 'active' if path.startswith('/library') }}">Library</a>
      <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Settings</a>
    </nav>
    <span id="printer-chip">
      <button class="small" hx-get="/printer/status" hx-target="#printer-chip" hx-swap="innerHTML">🖨 printer</button>
    </span>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    BPM and key measured with <a href="https://essentia.upf.edu" rel="noopener">Essentia</a>.
    Release data from <a href="https://www.discogs.com" rel="noopener">Discogs</a>.
  </footer>
</body>
</html>
