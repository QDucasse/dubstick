[project]
name = "dubstick"
version = "0.1.0"
description = "BPM and Camelot key labels for vinyl records"
authors = [
    { name = "Quentin Ducasse", email = "quentin.ducasse8@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "bleak>=3.1.0",
    "deno>=2.9.8",
    "essentia==2.1b6.dev1389",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
dubstick = "dubstick.app:run"
dubstick-printer = "dubstick.printer.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
